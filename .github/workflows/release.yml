# Builds the release packages (Windows 7 compatible build, see README "Windows 7 build") with Tools\make-release.ps1:
# the two portable zips and the installer.
#   push of a tag vX.Y.Z  -> draft GitHub release vX.Y.Z with the packages and the CHANGELOG section of X.Y.Z;
#                            check it and publish it by hand
#   Run workflow (manual) -> packages only, as a workflow artifact (to test the build)
# Code signing (SignPath Foundation, see README "Code signing policy"): active when the repository variables
# SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG and the secret SIGNPATH_API_TOKEN are set. Then a tag build sends
# two signing requests, each approved by hand on SignPath: the executables and DLLs built from this repository before
# they are packaged ("binaries"), and the installer ("installer"); the configurations are in .signpath/.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version written in the package names"
        default: "0.0.0-ci"
      sign:
        description: "Sign with SignPath (needs the version of the sources and an approval on SignPath)"
        type: boolean
        default: false

permissions:
  contents: write
  # the SignPath action reads the uploaded artifacts
  actions: read

env:
  # the MinGW the wiki page "Node simulation" asks users to install
  MINGW_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip
  VCREDIST2013_URL: https://aka.ms/highdpimfc2013x86enu
  # Ixxat VCI V4 driver package of HMS (README "Known build notes"): CAN_IXXAT_VCI needs the headers of its SDK.
  # HMS changes this link with every VCI version: take the new one from https://www.hms-networks.com/support/general-downloads
  IXXAT_VCI_URL: https://hmsnetworks.blob.core.windows.net/nlw/docs/default-source/products/ixxat/monitored/pc-interface-cards/vci-v4-0-1374-windows-11-10.zip?sfvrsn=2d1dfdd7_92
  IXXAT_VCI_INC: C:\Program Files\HMS\Ixxat VCI\sdk\vci\inc
  MSBUILD_ARGS: /p:Configuration=Release /p:Platform=Win32 /p:BusmasterWin7=true /m /nologo /v:minimal

jobs:
  build:
    runs-on: windows-2022
    # signing waits for the approvals on SignPath
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          "VERSION=$v" >> $env:GITHUB_ENV
          $sign = "${{ vars.SIGNPATH_PROJECT_SLUG }}" -ne "" -and ("${{ github.ref_type }}" -eq "tag" -or "${{ inputs.sign }}" -eq "true")
          "SIGN=$($sign.ToString().ToLower())" >> $env:GITHUB_ENV
          "Version $v, code signing: $sign"

      - name: MSVC 14.38 toolset with MFC and ATL
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -Wait -PassThru -ArgumentList @(
            "modify", "--installPath", "`"$vs`"", "--quiet", "--norestart", "--nocache",
            "--add", "Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.14.38.17.8.MFC",
            "--add", "Microsoft.VisualStudio.Component.VC.14.38.17.8.ATL")
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Visual Studio installer failed ($($p.ExitCode))" }
          if (-not (Test-Path "$vs\VC\Redist\MSVC\14.38.33130\x86\Microsoft.VC143.MFC")) { throw "14.38 runtime not installed" }
          "MSBUILD=" + (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1) >> $env:GITHUB_ENV

      - name: Cache MinGW
        id: mingw-cache
        uses: actions/cache@v6
        with:
          path: C:\winlibs\mingw32
          key: winlibs-${{ env.MINGW_URL }}

      - name: MinGW
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest $env:MINGW_URL -OutFile "$env:RUNNER_TEMP\mingw.zip"
          # not C:\mingw32: the runner already has another MinGW there
          Expand-Archive "$env:RUNNER_TEMP\mingw.zip" C:\winlibs
          if (-not (Test-Path C:\winlibs\mingw32\bin\g++.exe)) { throw "g++.exe not found in C:\winlibs\mingw32\bin" }

      - name: Visual C++ 2013 runtime and Inno Setup
        run: |
          New-Item -ItemType Directory -Force Tools\redist | Out-Null
          Invoke-WebRequest $env:VCREDIST2013_URL -OutFile Tools\redist\vcredist2013_x86.exe
          $sig = Get-AuthenticodeSignature Tools\redist\vcredist2013_x86.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "vcredist2013_x86.exe: bad signature" }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # only the headers are needed (the driver loads vcinpl.dll at run time), in the folder the project expects
      - name: Cache Ixxat VCI SDK headers
        id: ixxat-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.IXXAT_VCI_INC }}
          key: ixxat-vci-inc-${{ env.IXXAT_VCI_URL }}

      - name: Ixxat VCI SDK
        if: steps.ixxat-cache.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest $env:IXXAT_VCI_URL -OutFile "$env:RUNNER_TEMP\ixxat.zip"
          Expand-Archive "$env:RUNNER_TEMP\ixxat.zip" "$env:RUNNER_TEMP\ixxat"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\ixxat" -Recurse -Filter "Ixxat VCI Setup *.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "Ixxat VCI Setup not found in the package" }
          $sig = Get-AuthenticodeSignature $setup.FullName
          "$($setup.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "HMS") { throw "$($setup.Name): bad signature" }
          # only the SDK, no drivers; sdk\npl (native programming library) has vcinpl.h and is not in the default
          # selection. If the setup still does not end after copying its files, stop it once the headers are there
          # and the log has been quiet for a minute
          $log = "$env:RUNNER_TEMP\ixxat-setup.log"
          $p = Start-Process $setup.FullName -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/TYPE=custom", "/COMPONENTS=`"core,sdk,sdk\vci,sdk\npl`"", "/LOG=`"$log`""
          $deadline = (Get-Date).AddMinutes(15)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep 10
            $quiet = (Test-Path $log) -and ((Get-Date) - (Get-Item $log).LastWriteTime).TotalSeconds -gt 60
            if ($quiet -and (Test-Path "$env:IXXAT_VCI_INC\vcinpl.h")) { "Setup quiet for a minute: stopping it"; taskkill /T /F /PID $p.Id; break }
          }
          Get-Content $log -Tail 5
          $headers = @(Get-ChildItem $env:IXXAT_VCI_INC -Filter *.h -ErrorAction SilentlyContinue)
          "$($headers.Count) headers in $env:IXXAT_VCI_INC"
          # VCI 4.0.1374 has 28; vcinpl.h needs these
          foreach ($h in "vcinpl.h", "vcisdk.h", "vcitype.h", "vciver.h", "vcierr.h", "cantype.h", "lintype.h", "baltype.h", "stdtype.h") {
            if (-not (Test-Path "$env:IXXAT_VCI_INC\$h")) { throw "$h not found in $env:IXXAT_VCI_INC" }
          }

      - name: Build Kernel
        run: |
          & $env:MSBUILD Sources\Kernel\BusmasterKernel.sln $env:MSBUILD_ARGS.Split(" ")
          if ($LASTEXITCODE -ne 0) { throw "Kernel build failed" }

      - name: Build BUSMASTER
        run: |
          & $env:MSBUILD Sources\BUSMASTER\BUSMASTER.sln $env:MSBUILD_ARGS.Split(" ")
          "BUSMASTER.sln exit code $LASTEXITCODE"
          # projects the solution may skip after a failure (README "Windows 7 build")
          $sln = (Resolve-Path Sources\BUSMASTER).Path + "\"
          foreach ($proj in @(@("Application\BUSMASTER.vcxproj", "BUSMASTER.exe"), @("CAN_STUB\CAN_STUB.vcxproj", "CAN_STUB.dll"))) {
            if (-not (Test-Path "Sources\BUSMASTER\BIN\Release\$($proj[1])")) {
              & $env:MSBUILD "Sources\BUSMASTER\$($proj[0])" $env:MSBUILD_ARGS.Split(" ") /p:BuildProjectReferences=false "/p:SolutionDir=$sln"
              if ($LASTEXITCODE -ne 0) { throw "$($proj[0]) build failed" }
            }
          }
          if (-not (Test-Path Sources\BUSMASTER\BIN\Release\CAN_IXXAT_VCI.dll)) { throw "CAN_IXXAT_VCI.dll was not built" }
          exit 0

      - name: Build language DLLs and Format Converter
        run: |
          # CAN_PEAK_USBJPN needs the PEAK driver sources, which are not in the repository: it fails and the rest goes on
          & $env:MSBUILD "Sources\BUSMASTER\Language Dlls\Language Dlls.sln" $env:MSBUILD_ARGS.Split(" ")
          "Language Dlls.sln exit code $LASTEXITCODE (CAN_PEAK_USBJPN is expected to fail)"
          if (-not (Test-Path Sources\BUSMASTER\BIN\Release\JPN\BUSMASTERJPN.dll)) { throw "Language DLLs build failed" }
          $fc = "Sources\BUSMASTER\Format Converter"
          foreach ($c in @(@("AscLogConverter", "Asc_Log"), @("LogAscConverter", "Log_Asc"))) {
            $d = "$fc\$($c[0])\$($c[1])"
            & Tools\flex\flex.exe -i -L "-o$d`_Lexer.c" "$d`_Lexer.l"
            Push-Location Tools\bison
            & .\bison.exe -d -l "-o..\..\$d`_Parser.c" "..\..\$d`_Parser.y"
            Pop-Location
          }
          & $env:MSBUILD "$fc\FormatConverter.sln" $env:MSBUILD_ARGS.Split(" ")
          if ($LASTEXITCODE -ne 0) { throw "Format Converter build failed" }

      - name: Binaries to sign
        if: env.SIGN == 'true'
        run: |
          # the executables and DLLs built from this repository; not the prebuilt files tracked in BIN\Release
          # (inherited from BUSMASTER 3.2.2 and vendor libraries) nor DMGraph, a third-party control built as it is
          $bin = (Resolve-Path Sources\BUSMASTER\BIN\Release).Path
          $prebuilt = git ls-files Sources/BUSMASTER/BIN/Release | ForEach-Object { (Join-Path (Get-Location) $_.Replace("/", "\")).ToLower() }
          $files = Get-ChildItem $bin -Recurse -File -Include *.exe, *.dll |
            Where-Object { $prebuilt -notcontains $_.FullName.ToLower() -and $_.Name -notlike "DMGraph*" }
          foreach ($f in $files) {
            $dest = Join-Path signing\unsigned $f.FullName.Substring($bin.Length + 1)
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item $f.FullName $dest
          }
          "$($files.Count) files to sign"

      - name: Upload binaries to sign
        if: env.SIGN == 'true'
        id: upload-unsigned-binaries
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-binaries
          path: signing/unsigned/

      - name: Sign binaries (SignPath, needs approval)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5400
          output-artifact-directory: signing/signed
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Use the signed binaries
        if: env.SIGN == 'true'
        run: |
          $signed = (Resolve-Path signing\signed).Path
          $files = Get-ChildItem $signed -Recurse -File
          foreach ($f in $files) {
            if ((Get-AuthenticodeSignature $f.FullName).Status -ne "Valid") { throw "Not signed: $($f.FullName)" }
            Copy-Item $f.FullName (Join-Path Sources\BUSMASTER\BIN\Release $f.FullName.Substring($signed.Length + 1)) -Force
          }
          "$($files.Count) signed files copied to BIN\Release"

      - name: Packages
        run: |
          .\Tools\make-release.ps1 -Version $env:VERSION -MinGW C:\winlibs\mingw32 -Installer
          Get-ChildItem "release-out\BUSMASTER-NG_$env:VERSION" -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path release-out).Path.Length + 1) } | Sort-Object

      - name: Upload installer to sign
        if: env.SIGN == 'true'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: release-out/*_setup.exe

      - name: Sign installer (SignPath, needs approval)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5400
          output-artifact-directory: signing/installer
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: |
          $setup = Get-ChildItem signing\installer -Filter *_setup.exe | Select-Object -First 1
          if ($null -eq $setup -or (Get-AuthenticodeSignature $setup.FullName).Status -ne "Valid") { throw "Signed installer missing" }
          Copy-Item $setup.FullName release-out -Force
          "{0}  SHA-256 {1}" -f $setup.Name, (Get-FileHash $setup.FullName -Algorithm SHA256).Hash

      - uses: actions/upload-artifact@v7
        with:
          name: BUSMASTER-NG_${{ env.VERSION }}
          path: |
            release-out/*.zip
            release-out/*_setup.exe

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the CHANGELOG section "## X.Y.Z ..." up to the next "## "
          $notes = ((Get-Content CHANGELOG.md -Raw) -split "(?m)^## ") | Where-Object { $_ -match "^$([regex]::Escape($env:VERSION))\b" } | Select-Object -First 1
          if ($null -eq $notes) { $notes = "See CHANGELOG.md" } else { $notes = ($notes -split "`n", 2)[1].Trim() }
          Set-Content "$env:RUNNER_TEMP\notes.md" $notes -Encoding utf8
          $files = Get-ChildItem release-out -File | Where-Object { $_.Name -like "*.zip" -or $_.Name -like "*_setup.exe" } | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" --draft --verify-tag --title "BUSMASTER-NG $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md" @files
